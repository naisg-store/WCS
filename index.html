<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WoW Midnight (12.0.7) Cheat Sheet - Midnight C.S.</title>
    <meta name="description" content="Quick reference cheat sheet for World of Warcraft: Midnight Season 1 stat priorities, rotations, and consumables.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- ADDON AESTHETIC OVERRIDES -->
    <style>
        :root {
            --surface: #111111;
            --surface-hover: #1a1a1a;
            --border: #333333;
            --border-hover: #666666;
        }
        .spec-card, .modal-content, .content-box, .filter-btn {
            backdrop-filter: none !important;
            border-radius: 4px !important;
            background: var(--surface) !important;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }
        .spell-item, .consume-item, .utility-item {
            background: #1a1a1a !important;
            border-radius: 2px !important;
            border: 1px solid #333333 !important;
            padding: 4px 8px !important;
        }
        .modal-section { margin-top: 15px; padding-top: 15px; }
        .class-title { font-family: 'Arial', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
<div class="video-parallax-container">
    <video autoplay loop muted playsinline class="video-bg">
        <source src="wow-bg.mp4" type="video/mp4">
    </video>
</div>
   
<header class="site-header">
    <div class="nav-container">
        <a href="index.html" class="logo">Midnight CS</a>
        <!-- Navigation omitted for brevity, keep your exact navigation block here -->
    </div>
</header>
    
    <div class="container">
        <div class="header">
            <h1>Easy WoW Midnight Cheat Sheet (Patch 12.0.7)</h1>
            <p>Patch 12.0.7 Priorities, Rotations & Consumables</p>
        </div>

        <div class="filter-nav">
            <button class="filter-btn active" onclick="filterSpecs('all')">All Roles</button>
            <button class="filter-btn" onclick="filterSpecs('dps')">DPS</button>
            <button class="filter-btn" onclick="filterSpecs('tank')">Tanks</button>
            <button class="filter-btn" onclick="filterSpecs('heal')">Healers</button>
        </div>

        <div class="specs-grid" id="specsContainer">
            <!-- SEO Anchors -->
            <div class="spec-card seo-static" data-class="Paladin" data-spec="Retribution">
                <div class="class-title">Paladin: Retribution <span class="role-badge role-dps">DPS</span></div>
                <div class="stat-priority">Priority: <span class="stat-highlight">Strength > Haste > Critical Strike</span></div>
                <p class="spec-notes">Easy Ret Pally rotation and stat priority for returning players.</p>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="forceCloseModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <div class="copyright">&copy; <span id="dynamicYear"></span> Midnight Cheat Sheet. Built for the community.</div>
    </footer>
    
    <script>
        let wowData = [];
        const container = document.getElementById('specsContainer');
        const modalOverlay = document.getElementById('detailModal');
        const modalBody = document.getElementById('modalBody');
        const buttons = document.querySelectorAll('.filter-btn');

        fetch('wow-database.json')
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.json();
            })
            .then(data => {
                wowData = data;
                container.innerHTML = ''; 
                renderCards('all'); 
            })
            .catch(error => {
                const staticCards = container.querySelectorAll('.seo-static');
                if (staticCards.length === 0) {
                    container.innerHTML = '<div class="loading-text" style="color: var(--role-dps);">Error loading database. Make sure wow-database.json is in the same folder.</div>';
                }
            });

        function handleImageError(img) {
            img.onerror = null; 
            img.src = 'https://wow.zamimg.com/images/wow/icons/small/inv_misc_questionmark.jpg';
        }

        function renderCards(filter) {
            container.innerHTML = '';
            wowData.forEach((item, index) => {
                if (filter === 'all' || item.role === filter) {
                    const card = document.createElement('div');
                    card.className = 'spec-card';
                    card.onclick = () => openModal(index);
                    const roleLabel = item.role.toUpperCase();
                    
                    card.innerHTML = `
                        <div class="class-title">${item.class}: ${item.spec} <span class="role-badge role-${item.role}">${roleLabel}</span></div>
                        <div class="stat-priority">Priority: <span class="stat-highlight">${item.stats}</span></div>
                        <p class="spec-notes" style="margin-top: 5px;"><em>Click for full rotation & consumes...</em></p>
                    `;
                    container.appendChild(card);
                }
            });
        }

        function buildRotationHTML(title, spellArray) {
            if (!spellArray || spellArray.length === 0) return '';
            return `
                <div class="modal-section-title">${title}</div>
                <div class="rotation-sequence">
                    ${spellArray.map((spell, idx) => `
                        <div class="spell-item">
                            <img src="https://wow.zamimg.com/images/wow/icons/small/${spell.icon.toLowerCase()}.jpg" alt="${spell.name}" class="spell-icon" onerror="handleImageError(this)">
                            ${spell.name}
                        </div>
                        ${idx < spellArray.length - 1 ? '<span class="sequence-arrow">></span>' : ''}
                    `).join('')}
                </div>
            `;
        }

        function renderConsume(item) {
            if (!item) return '<span style="font-size: 0.85rem; color: var(--text-muted);">N/A</span>';
            if (typeof item === 'string') return `<span style="font-size: 0.85rem; font-weight: 600;">${item}</span>`;
            
            return `
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
                    <img src="https://wow.zamimg.com/images/wow/icons/small/${item.icon.toLowerCase()}.jpg" class="spell-icon" style="width: 24px; height: 24px;" onerror="handleImageError(this)">
                    <div style="display: flex; flex-direction: column;">
                        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-main);">${item.name}</span>
                        <span class="buff-stat" style="font-size: 0.75rem;">${item.stat}</span>
                    </div>
                </div>
            `;
        }

        function openModal(index) {
            const item = wowData[index];
            const roleLabel = item.role.toUpperCase();
            
            let html = `
                <div class="class-title" style="font-size: 1.4rem;">${item.class}: ${item.spec} <span class="role-badge role-${item.role}" style="font-size: 0.8rem;">${roleLabel}</span></div>
                <div class="stat-priority" style="font-size: 0.95rem; margin-top: 10px;">Stat Priority: <span class="stat-highlight">${item.stats}</span></div>
                <p class="spec-notes" style="font-size: 0.9rem;">${item.notes}</p>
                
                <div class="modal-section">
                    ${buildRotationHTML("ST / Opener", item.rotationST)}
                    <br>
                    ${buildRotationHTML("AoE / Cleave", item.rotationAoE)}
                </div>
            `;

            if (item.consumes) {
                html += `
                    <div class="modal-section">
                        <div class="modal-section-title">Consumables</div>
                        <div class="consumes-grid" style="gap: 10px;">
                            <div class="consume-item"><div class="consume-label">Food</div>${renderConsume(item.consumes.food)}</div>
                            <div class="consume-item"><div class="consume-label">Flask</div>${renderConsume(item.consumes.flask)}</div>
                            <div class="consume-item"><div class="consume-label">Potion</div>${renderConsume(item.consumes.potion)}</div>
                            <div class="consume-item"><div class="consume-label">Weapon</div>${renderConsume(item.consumes.weapon)}</div>
                        </div>
                    </div>
                `;
            }

            modalBody.innerHTML = html;
            modalOverlay.classList.add('open');
            document.body.style.overflow = 'hidden'; 
        }

        function forceCloseModal() {
            modalOverlay.classList.remove('open');
            document.body.style.overflow = 'auto';
        }
        function closeModal(event) {
            if (event.target === modalOverlay) forceCloseModal();
        }

        window.filterSpecs = function(role) {
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards(role);
        }
    </script>
</body>
</html>
